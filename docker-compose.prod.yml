# Production stack for zenoteamsuite.com.
#   cp .env.production.example .env   (fill in the secrets)
#   docker compose -f docker-compose.prod.yml up -d --build
# The web container is published only on localhost; the host nginx proxies the domain to it.
# Video calls (livekit): signalling is proxied by the host nginx at /rtc; call media uses
# LIVEKIT_TCP_PORT and LIVEKIT_UDP_PORT directly, so open those two in the VPS firewall.
# Kept from the old domain: renaming the project would start on a new, empty database volume.
name: zenoworksuite

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenoworksuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zenoworksuite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zenoworksuite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zenoworksuite}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://zenoteamsuite.com","https://www.zenoteamsuite.com"]}
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      SONIX_API_KEY: ${SONIX_API_KEY:-}
      SONIOX_MODEL: ${SONIOX_MODEL:-stt-rt-v5}
      APP_URL: ${APP_URL:-https://zenoteamsuite.com}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ALLOWED_OWNERS: ${GITHUB_ALLOWED_OWNERS:-[]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      UPLOAD_DIR: /app/uploads
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://zenoteamsuite.com}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env (see .env.production.example)}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env (see .env.production.example)}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8092}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      # The whole server config; use_external_ip finds the VPS public IP for call media.
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: ${LIVEKIT_TCP_PORT:-7881}
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: true
        room:
          empty_timeout: 300
          max_participants: 50
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    ports:
      - "127.0.0.1:${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:${LIVEKIT_TCP_PORT:-7881}/tcp"
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"
    logging: *logging

volumes:
  pgdata:
  uploads:
