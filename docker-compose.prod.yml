# Production stack for zenoworksuite.com.
#   cp .env.production.example .env   (fill in the secrets)
#   docker compose -f docker-compose.prod.yml up -d --build
# Only the web container is published, and only on localhost; the host nginx proxies the domain to it.
name: zenoworksuite

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zenoworksuite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zenoworksuite}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zenoworksuite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zenoworksuite}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://zenoworksuite.com","https://www.zenoworksuite.com"]}
      SONIX_API_KEY: ${SONIX_API_KEY:-}
      APP_URL: ${APP_URL:-https://zenoworksuite.com}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8092}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
