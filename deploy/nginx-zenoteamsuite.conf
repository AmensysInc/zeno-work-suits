# Host nginx site for zenoteamsuite.com (same pattern as the other sites on the VPS).
# Install: sudo cp deploy/nginx-zenoteamsuite.conf /etc/nginx/sites-available/zenoteamsuite.com
#          sudo ln -sf /etc/nginx/sites-available/zenoteamsuite.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL (after DNS points to the VPS): sudo certbot --nginx -d zenoteamsuite.com -d www.zenoteamsuite.com
# Replaces the old zenoworksuite.com site: remove /etc/nginx/sites-enabled/zenoworksuite.com.
# Once certbot has added HTTPS, edit the live file instead of copying this one
# over it, or the certificate settings are lost.

# Sign-in attempts per client address (the backend also locks an email after
# repeated failures). Site files are included inside nginx's http block.
limit_req_zone $binary_remote_addr zone=zenoteamsuite_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name zenoteamsuite.com www.zenoteamsuite.com;

    location = /api/auth/login {
        limit_req zone=zenoteamsuite_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Whole-repository AI drafts read several parts in parallel and can take ~2 minutes.
    location /api/ai-generator/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30M;
        proxy_read_timeout 120s;
    }
}
