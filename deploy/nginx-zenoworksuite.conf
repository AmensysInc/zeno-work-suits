# Host nginx site for zenoworksuite.com (same pattern as the other sites on the VPS).
# Install: sudo cp deploy/nginx-zenoworksuite.conf /etc/nginx/sites-available/zenoworksuite.com
#          sudo ln -sf /etc/nginx/sites-available/zenoworksuite.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL (after DNS points to the VPS): sudo certbot --nginx -d zenoworksuite.com -d www.zenoworksuite.com

server {
    listen 80;
    listen [::]:80;
    server_name zenoworksuite.com www.zenoworksuite.com;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30M;
        proxy_read_timeout 120s;
    }
}
